jobs:
  cornix:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      build_matrix_path: cornix.yaml
      archive_name: cornix

  totem:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
