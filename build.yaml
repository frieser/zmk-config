---
include:
  # Cornix
  - board: cornix_left
    artifact-name: cornix_left_default

  - board: cornix_ph_left
    artifact-name: cornix_left_for_dongle

  - board: cornix_right
    artifact-name: cornix_right

  - board: nice_nano
    shield: cornix_dongle_adapter cornix_dongle_eyelash dongle_display
    snippet: studio-rpc-usb-uart
    artifact-name: cornix_dongle

  # Totem
  - board: seeeduino_xiao_ble
    shield: totem_left
    artifact-name: totem_left

  - board: seeeduino_xiao_ble
    shield: totem_right
    artifact-name: totem_right

  - board: seeeduino_xiao_ble
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem_left_for_dongle

  - board: nice_nano_v2
    shield: totem_dongle dongle_display
    artifact-name: totem_dongle

  # Forager
  - board: seeeduino_xiao_ble
    shield: forager_left
    artifact-name: forager_left

  - board: seeeduino_xiao_ble
    shield: forager_right
    artifact-name: forager_right

  - board: seeeduino_xiao_ble
    shield: forager_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: forager_left_for_dongle

  - board: nice_nano_v2
    shield: forager_dongle dongle_display
    artifact-name: forager_dongle

  # Reset shields
  - board: cornix_right
    shield: settings_reset
    artifact-name: cornix_reset

  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: totem_reset

  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: forager_reset

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: dongle_reset
