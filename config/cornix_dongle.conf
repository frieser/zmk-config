#include "cornix.conf"

CONFIG_ZMK_KEYBOARD_NAME="Cornix Dongle"

# Split central configuration (required for dongle_display)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Battery level proxying from peripherals
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# BLE connections (peripherals + host profiles)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Display (SH1106 OLED via I2C)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

