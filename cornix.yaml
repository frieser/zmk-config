---
# NOTE: `alias-of` is understood by ci/build-firmware.sh and build-all.sh only.
# GitHub's build.yaml format does not support it, and this repo does not use
# build.yaml (see AGENTS.md: Forgejo + Tekton is the CI).
include:
  # Cornix keyboards
  - board: cornix_left
    artifact-name: cornix_left_default

  - board: cornix_ph_left
    artifact-name: cornix_left_for_dongle

  - board: cornix_right
    artifact-name: cornix_right

  - board: nice_nano_v2
    shield: cornix_dongle_adapter cornix_dongle_eyelash dongle_display
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: cornix_dongle_nosd

  # Reset shields
  # This one is the canonical nice_nano_v2 reset image: the totem and forager
  # dongle resets are byte-identical, so they alias it instead of rebuilding it.
  - board: cornix_right
    shield: settings_reset
    artifact-name: cornix_reset

  - board: nice_nano_v2
    shield: settings_reset
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: cornix_dongle_reset_nosd
