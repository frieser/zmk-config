---
# NOTE: `alias-of` is understood by ci/build-firmware.sh and build-all.sh only.
# It copies the named artifact's .uf2 under this artifact name instead of
# compiling an identical image a second time.
include:
  # Forager keyboards
  - board: seeeduino_xiao_ble
    shield: forager_left
    artifact-name: forager_left

  - board: seeeduino_xiao_ble
    shield: forager_right
    artifact-name: forager_right

  - board: seeeduino_xiao_ble
    shield: forager_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: forager_left_for_dongle

  - board: nice_nano_v2
    shield: forager_dongle dongle_display
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: forager_dongle_nosd

  # Reset shields: this one is the canonical seeeduino_xiao_ble reset image
  # (totem_reset aliases it); settings_reset never reads the keymap.
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: forager_reset

  - alias-of: cornix_dongle_reset_nosd
    artifact-name: forager_dongle_reset_nosd
