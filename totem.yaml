---
# NOTE: `alias-of` is understood by ci/build-firmware.sh and build-all.sh only.
# It copies the named artifact's .uf2 under this artifact name instead of
# compiling an identical image a second time.
include:
  # Totem keyboards
  - board: seeeduino_xiao_ble
    shield: totem_left
    artifact-name: totem_left

  - board: seeeduino_xiao_ble
    shield: totem_right
    artifact-name: totem_right

  - board: seeeduino_xiao_ble
    shield: totem_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: totem_left_for_dongle

  - board: nice_nano_v2
    shield: totem_dongle dongle_display
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: totem_dongle_nosd

  # Reset shields: same board+shield+snippet as the forager/cornix ones, and
  # settings_reset builds never read the keymap, so the images are identical.
  - alias-of: forager_reset
    artifact-name: totem_reset

  - alias-of: cornix_dongle_reset_nosd
    artifact-name: totem_dongle_reset_nosd
